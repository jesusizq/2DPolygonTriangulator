name: "3d-processor"

services:
  # Gateway - Caddy for SSL and Reverse Proxy
  gateway:
    image: caddy:2-alpine
    container_name: gateway
    restart: unless-stopped
    # Resource limits so no single service can starve the shared VPS
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 128
    ports:
      - "${GATEWAY_HTTP_BIND:-0.0.0.0}:${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_BIND:-0.0.0.0}:${GATEWAY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # Mesh Processor Service - C++ Microservice for triangulation
  mesh-processor:
    build:
      context: ../mesh-processor
      dockerfile: Dockerfile
      target: runtime
    container_name: mesh_processor
    restart: unless-stopped
    # Roomier than the others: this one actually chews meshes when visited
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: 128
    # Internal port only, exposed via gateway/frontend
    expose:
      - "8080"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Frontend Service - Nginx serving WebGL application with WASM
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: frontend
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 128
    # Internal port only, exposed via gateway
    expose:
      - "80"
    depends_on:
      mesh-processor:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve
      # también a ::1, el wget de BusyBox intenta esa primero y nginx solo hace
      # `listen 80` (IPv4), así que el check fallaba siempre con "Connection
      # refused" aunque el sitio sirviera bien. curl reintenta con la otra
      # familia de direcciones (de ahí que mesh-processor sí saliera healthy);
      # wget no.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
